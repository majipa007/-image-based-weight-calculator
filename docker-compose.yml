services:
  postgres:
    image: postgres:16
    container_name: goat_weight_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: goat_weight
      POSTGRES_USER: goat_user
      POSTGRES_PASSWORD: goat_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goat_user -d goat_weight"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
